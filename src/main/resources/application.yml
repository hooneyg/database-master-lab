spring:
  application:
    name: database-master-lab

  # ─────────────────────────────────────────────────────────
  # 🗄️ Database 설정 (H2 In-memory)
  # ─────────────────────────────────────────────────────────
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  # ─────────────────────────────────────────────────────────
  # 🍃 JPA / Hibernate 설정
  # ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100 # N+1 문제 해결을 위한 기본 배치 사이즈

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE # 쿼리 파라미터 값 바인딩 로그 확인
