version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: database-master-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/masterdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-network

  postgres:
    image: postgres:15-alpine
    container_name: database-master-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=masterdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d masterdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

networks:
  db-network:
    driver: bridge
