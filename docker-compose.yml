version: '3.8'

services:
  # =========================================================
  # ☕ Spring Boot Application (Database Master Lab)
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: database-master-app
    ports:
      - "8080:8080" # 외부(호스트) 포트:내부(컨테이너) 포트
    environment:
      # 프로필을 docker로 지정하여 H2 대신 PostgreSQL 사용 유도
      - SPRING_PROFILES_ACTIVE=docker
      # DB 컨테이너 이름(postgres)을 도메인으로 사용하여 연결
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/masterdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        # DB가 단순히 켜지는 것을 넘어 연결 준비(healthy) 상태일 때만 App 실행
        condition: service_healthy
    networks:
      - db-network

  # =========================================================
  # 🗄️ PostgreSQL Database (엔터프라이즈 영속성 계층)
  # =========================================================
  postgres:
    image: postgres:15-alpine # 경량화된 Alpine 기반 이미지 사용
    container_name: database-master-postgres
    ports:
      - "5432:5432"
    environment:
      # 기본 생성할 DB명 및 접속 계정 설정
      - POSTGRES_DB=masterdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      # pg_isready 명령어로 DB 접속 가능 상태를 주기적으로 체크
      test: ["CMD-SHELL", "pg_isready -U postgres -d masterdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

# =========================================================
# 🕸️ 내부 네트워크 격리 (보안 강화)
# =========================================================
networks:
  db-network:
    driver: bridge
