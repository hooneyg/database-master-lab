plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hooney.lab'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ═══════════════════════════════════════════════════════
    // 🍃 Spring Boot Starters
    // ═══════════════════════════════════════════════════════
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ═══════════════════════════════════════════════════════
    // 🗄️ Database & Persistance
    // ═══════════════════════════════════════════════════════
    // H2: 로컬 개발 및 테스트용 인메모리 DB
    runtimeOnly 'com.h2database:h2'
    
    // MyBatis: SQL 매핑 방식 (Module 2 비교용)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'

    // QueryDSL: 동적 쿼리 및 타입 세이프 쿼리 (Module 2, 3용)
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // ═══════════════════════════════════════════════════════
    // 🛠️ Utilities
    // ═══════════════════════════════════════════════════════
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    
    // MapStruct: DTO ↔ Entity 자동 매핑 (현업 필수)
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // ═══════════════════════════════════════════════════════
    // 🧪 Testing
    // ═══════════════════════════════════════════════════════
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-subclass:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs "-Djdk.attach.allowAttachSelf=true", "-XX:+EnableDynamicAgentLoading"
}

// ─────────────────────────────────────────────────────────
// 🔍 QueryDSL 설정 (Generated Q-Classes 경로 지정)
// ─────────────────────────────────────────────────────────
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(querydslDir)
}

clean {
    delete querydslDir
}
